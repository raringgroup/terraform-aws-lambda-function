description: |-
  Deploys an AWS Lambda function from a zip file or a docker image, with an IAM role that can optionally attach
  policies for CloudWatch Logs, CloudWatch Insights, VPC access and X-Ray tracing.

# How to use this module. Should be an easy example to copy and paste.
usage: |-
  Naming and tagging come from [`terraform-null-context`](https://github.com/raringgroup/terraform-null-context). Add
  `_context.tf` to the calling configuration and pass `context = module.context.self`.

  ```hcl
  module "lambda" {
    source = "git::https://github.com/raringgroup/terraform-aws-lambda-function.git?ref=v0.1.0"

    context = module.context.self

    filename      = "lambda.zip"
    function_name = "my-function"
    handler       = "handler.handler"
    runtime       = "nodejs14.x"
  }
  ```

  See [`examples/`](examples/) for complete, runnable configurations. Automated tests of the complete example use
  [bats](https://github.com/bats-core/bats-core) and [Terratest](https://github.com/gruntwork-io/terratest)
  (which test and deploy the example on AWS); see [test](test).

examples: |-
  - [`examples/complete`](examples/complete) - complete example of using this module with a zip file
  - [`examples/docker-image`](examples/docker-image) - example of deploying from a docker image

